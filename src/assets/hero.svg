<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <defs>
    <clipPath id="win">
      <rect x="12" y="12" width="456" height="316" rx="12"/>
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13131a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#13131a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <!-- window background -->
    <rect x="12" y="12" width="456" height="316" fill="#13131a"/>

    <!-- title bar -->
    <rect x="12" y="12" width="456" height="42" fill="#1c1c26"/>
    <line x1="12" y1="54" x2="468" y2="54" stroke="#317fd0" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- window dots -->
    <circle cx="36" cy="33" r="5" fill="#2a2a38"/>
    <circle cx="54" cy="33" r="5" fill="#2a2a38"/>
    <circle cx="72" cy="33" r="5" fill="#2a2a38"/>

    <!-- active file tab -->
    <rect x="96" y="18" width="132" height="30" rx="6" fill="#13131a"/>
    <rect x="110" y="28" width="5" height="10" rx="1.5" fill="#317fd0" opacity="0.7"/>
    <rect x="121" y="30" width="64" height="7" rx="2" fill="#3e3e52"/>
    <rect x="96" y="48" width="132" height="2" fill="#317fd0" opacity="0.5"/>

    <!-- line-number gutter -->
    <rect x="12" y="54" width="32" height="274" fill="#16161e"/>

    <!-- ── row 1: import { X } from 'y' ── -->
    <rect x="17" y="61" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="52" y="61" width="38" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="96" y="61" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="109" y="61" width="58" height="7" rx="2" fill="#7cb8e0"/>
    <rect x="173" y="61" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="186" y="61" width="26" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="218" y="61" width="84" height="7" rx="2" fill="#a8d4a0" opacity="0.9"/>

    <!-- ── row 2: import { X } from 'y' ── -->
    <rect x="17" y="83" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="52" y="83" width="38" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="96" y="83" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="109" y="83" width="44" height="7" rx="2" fill="#7cb8e0"/>
    <rect x="159" y="83" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="172" y="83" width="26" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="204" y="83" width="98" height="7" rx="2" fill="#a8d4a0" opacity="0.9"/>

    <!-- ── row 3: blank ── -->
    <rect x="17" y="105" width="18" height="7" rx="2" fill="#232332"/>

    <!-- ── row 4: export const config: T = { ── -->
    <rect x="17" y="127" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="52" y="127" width="38" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="96" y="127" width="26" height="7" rx="2" fill="#317fd0" opacity="0.6"/>
    <rect x="128" y="127" width="46" height="7" rx="2" fill="#b8a0e8"/>
    <rect x="180" y="127" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="193" y="127" width="52" height="7" rx="2" fill="#7cb8e0"/>
    <rect x="251" y="127" width="7"  height="7" rx="2" fill="#44445a"/>
    <rect x="264" y="127" width="9"  height="7" rx="2" fill="#44445a"/>

    <!-- ── row 5: title: '...' ── -->
    <rect x="17" y="149" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="68" y="149" width="24" height="7" rx="2" fill="#e0e0f0" opacity="0.75"/>
    <rect x="97" y="149" width="5"  height="7" rx="2" fill="#44445a"/>
    <rect x="108" y="149" width="128" height="7" rx="2" fill="#a8d4a0" opacity="0.9"/>
    <rect x="242" y="149" width="5"  height="7" rx="2" fill="#44445a"/>

    <!-- ── row 6: sidebar: [...] ── -->
    <rect x="17" y="171" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="68" y="171" width="36" height="7" rx="2" fill="#e0e0f0" opacity="0.75"/>
    <rect x="110" y="171" width="5"  height="7" rx="2" fill="#44445a"/>
    <rect x="121" y="171" width="58" height="7" rx="2" fill="#e0e0f0" opacity="0.42"/>

    <!-- ── row 7 (active): plugins: [...] with cursor ── -->
    <rect x="12"  y="188" width="456" height="22" fill="#317fd0" opacity="0.08"/>
    <rect x="12"  y="188" width="32"  height="22" fill="#317fd0" opacity="0.1"/>
    <rect x="17"  y="193" width="18" height="7" rx="2" fill="#317fd0" opacity="0.5"/>
    <rect x="68"  y="193" width="48" height="7" rx="2" fill="#e0e0f0" opacity="0.75"/>
    <rect x="122" y="193" width="5"  height="7" rx="2" fill="#44445a"/>
    <rect x="133" y="193" width="82" height="7" rx="2" fill="#ffd080" opacity="0.88"/>
    <!-- blinking cursor -->
    <rect x="221" y="191" width="6" height="11" rx="1" fill="#317fd0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- ── row 8: } ── -->
    <rect x="17" y="215" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="52" y="215" width="7"  height="7" rx="2" fill="#44445a"/>

    <!-- ── row 9: blank ── -->
    <rect x="17" y="237" width="18" height="7" rx="2" fill="#232332"/>

    <!-- ── row 10: export async function getStaticPaths() ── -->
    <rect x="17"  y="259" width="18" height="7" rx="2" fill="#2a2a38"/>
    <rect x="52"  y="259" width="38" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="96"  y="259" width="26" height="7" rx="2" fill="#317fd0" opacity="0.65"/>
    <rect x="128" y="259" width="46" height="7" rx="2" fill="#317fd0" opacity="0.8"/>
    <rect x="180" y="259" width="52" height="7" rx="2" fill="#b8a0e8"/>
    <rect x="238" y="259" width="5"  height="7" rx="2" fill="#44445a"/>
    <rect x="249" y="259" width="5"  height="7" rx="2" fill="#44445a"/>
    <rect x="260" y="259" width="44" height="7" rx="2" fill="#7cb8e0" opacity="0.75"/>
    <rect x="310" y="259" width="10" height="7" rx="2" fill="#44445a"/>

    <!-- ── row 11: fading return ── -->
    <rect x="17"  y="281" width="18" height="7" rx="2" fill="#232332"/>
    <rect x="68"  y="281" width="96" height="7" rx="2" fill="#e0e0f0" opacity="0.28"/>
    <rect x="170" y="281" width="62" height="7" rx="2" fill="#e0e0f0" opacity="0.14"/>

    <!-- bottom fade -->
    <rect x="12" y="262" width="456" height="66" fill="url(#fade)"/>
  </g>

  <!-- window border -->
  <rect x="12" y="12" width="456" height="316" rx="12" stroke="#317fd0" stroke-width="1" stroke-opacity="0.22"/>
</svg>
