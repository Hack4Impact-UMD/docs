<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="100%" role="img" aria-labelledby="egm-loop-title" font-size="13">
  <title id="egm-loop-title">Goldfish check the idea and the spec before any code is written</title>
  <defs>
    <marker id="egm-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="currentColor">Goldfish check the idea and the spec before any code is written</text>
  <text x="24" y="52" font-size="11.5" fill="currentColor" fill-opacity="0.7">The EGM core loop; every skill also works on its own</text>
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.25">
    <path d="M180 138H209" marker-end="url(#egm-loop-arrow)"/>
    <path d="M365 138H394" marker-end="url(#egm-loop-arrow)"/>
    <path d="M550 138H579" marker-end="url(#egm-loop-arrow)"/>
    <path d="M657 100V80H287V100" marker-end="url(#egm-loop-arrow)"/>
    <path d="M657 176V232" marker-end="url(#egm-loop-arrow)"/>
    <path d="M579 270H550" marker-end="url(#egm-loop-arrow)"/>
  </g>
  <text x="472" y="72" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.7">revise the doc</text>
  <text x="649" y="208" text-anchor="end" font-size="11.5" fill="currentColor" fill-opacity="0.7">design approved</text>
  <g>
    <rect x="24" y="100" width="156" height="76" rx="8" fill="var(--sl-color-accent-low, #e0e7ff)" stroke="var(--sl-color-accent, #4f46e5)" stroke-width="2"/>
    <text x="102" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="currentColor">/egm-brainstorm</text>
    <text x="102" y="146" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">goldfish swarm</text>
    <text x="102" y="162" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">with six lenses</text>
  </g>
  <g>
    <rect x="209" y="100" width="156" height="76" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25"/>
    <text x="287" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="currentColor">/egm-draft</text>
    <text x="287" y="146" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">elephant writes,</text>
    <text x="287" y="162" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">you weigh in</text>
  </g>
  <g>
    <rect x="394" y="100" width="156" height="76" rx="8" fill="var(--sl-color-accent-low, #e0e7ff)" stroke="var(--sl-color-accent, #4f46e5)" stroke-width="2"/>
    <text x="472" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="currentColor">/egm-review</text>
    <text x="472" y="146" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">fresh goldfish,</text>
    <text x="472" y="162" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">five stages</text>
  </g>
  <g>
    <rect x="579" y="100" width="156" height="76" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25"/>
    <text x="657" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="currentColor">/egm-resolve</text>
    <text x="657" y="146" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">you pick which</text>
    <text x="657" y="162" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">findings to act on</text>
  </g>
  <g>
    <rect x="579" y="232" width="156" height="76" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25"/>
    <text x="657" y="258" text-anchor="middle" font-weight="600" fill="currentColor">Human review</text>
    <text x="657" y="278" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">a teammate reads</text>
    <text x="657" y="294" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">the design PR</text>
  </g>
  <g>
    <rect x="394" y="232" width="156" height="76" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25"/>
    <text x="472" y="258" text-anchor="middle" font-weight="600" fill="currentColor">Implement</text>
    <text x="472" y="278" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">your agent builds</text>
    <text x="472" y="294" text-anchor="middle" font-size="11.5" fill="currentColor" fill-opacity="0.75">to the plan</text>
  </g>
  <g>
    <rect x="24" y="250" width="14" height="14" rx="3" fill="var(--sl-color-accent-low, #e0e7ff)" stroke="var(--sl-color-accent, #4f46e5)" stroke-width="2"/>
    <text x="48" y="261" font-size="11.5" fill="currentColor">Highlighted steps use goldfish:</text>
    <text x="48" y="277" font-size="11.5" fill="currentColor" fill-opacity="0.7">fresh subagents that never saw the chat</text>
  </g>
</svg>
